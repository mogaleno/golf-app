<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F2F5F1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0C1310" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Rondas">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,-apple-system,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<script>window.PWA_BUILD=true;</script>
</head>
<body>
<title>Rondas de Golf</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600;700&display=swap">
<style>
/* Layout: one-thumb course tool. Sticky hole header on top, shot list in the middle,
   every control in the bottom half; pickers rise as bottom sheets. Yardage-book type, scoreboard numbers. */
:root{
  --bg:#F2F5F1;          /* course paper */
  --surface:#FFFFFF;
  --sunk:#E4EAE3;
  --ink:#0F1C15;         /* near-black green */
  --muted:#56665D;
  --line:#CBD5CC;
  --accent:#17663F;      /* fairway */
  --accent-ink:#FFFFFF;
  --flag:#F2B705;        /* pin flag */
  --flag-ink:#1A1400;
  --good:#17663F;
  --warn:#B86A00;
  --bad:#B3261E;
  --under:#1F5FAD;       /* under par */
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0C1310;--surface:#16201B;--sunk:#1F2B25;--ink:#EAF1EC;--muted:#9AABA1;--line:#2E3D35;
  --accent:#3FB57A;--accent-ink:#04140B;--flag:#F5C431;--flag-ink:#1A1400;--good:#4CC487;--warn:#E3A13A;--bad:#F07167;--under:#7FB2F0;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0C1310;--surface:#16201B;--sunk:#1F2B25;--ink:#EAF1EC;--muted:#9AABA1;--line:#2E3D35;
  --accent:#3FB57A;--accent-ink:#04140B;--flag:#F5C431;--flag-ink:#1A1400;--good:#4CC487;--warn:#E3A13A;--bad:#F07167;--under:#7FB2F0;color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.35;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button{font:inherit;color:inherit;cursor:pointer;border:none;background:none}
html,body,button,.keys{touch-action:manipulation}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--flag);outline-offset:2px}
input,select,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;min-height:48px;width:100%}
textarea{min-height:120px;font-size:13px;font-family:ui-monospace,Menlo,monospace}
label.f{display:flex;flex-direction:column;gap:6px;font-size:14px;color:var(--muted);font-weight:600}
.num{font-variant-numeric:tabular-nums}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
main{max-width:640px;margin:0 auto;padding-block:12px 140px;display:flex;flex-direction:column;gap:14px}

/* top bars */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.top-in{max-width:640px;margin:0 auto;padding-block:10px;display:flex;align-items:center;gap:10px}
.brand{font-family:var(--display);font-weight:700;font-size:26px;letter-spacing:.3px;flex:1}
.brand small{display:block;font-family:var(--body);font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.6px;text-transform:uppercase}
.iconbtn{min-width:48px;min-height:48px;border-radius:12px;display:grid;place-items:center;font-weight:700;font-size:15px;background:var(--sunk)}
.iconbtn.txt{padding:0 14px}

/* hole header */
.holehead{display:grid;grid-template-columns:56px 1fr 56px;align-items:center;gap:8px}
.holehead .mid{text-align:center}
.holeno{font-family:var(--display);font-weight:700;font-size:34px;line-height:1}
.holemeta{font-size:15px;color:var(--muted);font-weight:600}
.holemeta b{color:var(--ink)}
.navbtn{min-height:56px;border-radius:14px;background:var(--sunk);font-family:var(--display);font-size:30px;font-weight:700}
.navbtn:disabled{opacity:.35}

/* generic blocks */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
h2{font-family:var(--display);font-weight:700;font-size:24px;margin:0;text-wrap:balance}
h3{font-size:13px;letter-spacing:.8px;text-transform:uppercase;color:var(--muted);margin:0;font-weight:700}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grow{flex:1;min-width:0}
.btn{min-height:56px;border-radius:14px;padding:0 18px;font-weight:700;font-size:17px;background:var(--sunk);display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.flag{background:var(--flag);color:var(--flag-ink)}
.btn.ghost{background:transparent;border:1.5px solid var(--line)}
.btn.danger{background:transparent;border:1.5px solid var(--bad);color:var(--bad)}
.btn.block{width:100%}
.btn.sm{min-height:44px;font-size:15px;padding:0 14px}
.muted{color:var(--muted)}
.tag{display:inline-block;font-size:12px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;padding:3px 8px;border-radius:6px;background:var(--sunk);color:var(--muted)}
.tag.flag{background:var(--flag);color:var(--flag-ink)}
.empty{color:var(--muted);text-align:center;padding:24px 8px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--sunk);border-radius:12px;padding:4px;gap:4px}
.seg button{min-height:48px;border-radius:9px;font-weight:700}
.seg button[aria-pressed="true"]{background:var(--surface);box-shadow:0 1px 2px rgba(0,0,0,.15)}
.switch{display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:56px}
.switch .t{font-weight:600}
.switch .d{font-size:14px;color:var(--muted)}
.tog{width:58px;height:34px;border-radius:20px;background:var(--line);position:relative;flex:none}
.tog::after{content:"";position:absolute;top:4px;left:4px;width:26px;height:26px;border-radius:50%;background:var(--surface);transition:left .15s}
.tog[aria-pressed="true"]{background:var(--accent)}
.tog[aria-pressed="true"]::after{left:28px}

/* round list */
.rcard{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center;text-align:left;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.rcard .nm{font-weight:700;font-size:18px}
.rcard .sc{font-family:var(--display);font-weight:700;font-size:34px;grid-row:span 2;text-align:right;line-height:1}
.rcard .sc small{display:block;font-size:15px;color:var(--muted);font-family:var(--body);font-weight:600}
.rcard.inplay{border:2px solid var(--accent)}

/* shots */
.shots{display:flex;flex-direction:column;gap:8px}
.shot{display:grid;grid-template-columns:34px minmax(0,1.25fr) minmax(0,1fr) minmax(0,.8fr) 48px 40px;gap:6px;align-items:stretch}
.shot .n{display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:20px;border-radius:9px;background:var(--sunk)}
.shot.cur .n{background:var(--flag);color:var(--flag-ink)}
.cell{min-height:54px;border-radius:10px;background:var(--surface);border:1.5px solid var(--line);font-weight:700;font-size:18px;display:flex;align-items:center;justify-content:center;padding:0 6px;white-space:nowrap;overflow:hidden}
.cell .u{font-size:13px;color:var(--muted);font-weight:600;margin-left:3px}
.cell.blank{color:var(--muted);font-weight:500}
.cell.small{font-size:14px}
.cell.dir{font-size:13px}
.shot .more{border-radius:10px;font-size:22px;font-weight:700;color:var(--muted)}
.penline{grid-column:2 / -1;font-size:14px;font-weight:700;color:var(--bad);padding:2px 4px}
.penrow{display:grid;grid-template-columns:34px minmax(0,1fr) 40px;gap:6px;align-items:stretch}
.penrow .n{display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:18px;border-radius:9px;background:var(--sunk);color:var(--bad)}
.pencell{min-height:46px;border-radius:10px;border:1.5px dashed var(--bad);display:flex;align-items:center;gap:10px;padding:0 12px;text-align:left;font-size:16px;flex-wrap:wrap}
.pencell b{color:var(--bad)}
.pencell span{color:var(--muted);font-size:14px}
.pick.pen{border-color:var(--bad);color:var(--bad)}
.holed{display:flex;align-items:center;gap:8px;padding:12px 14px;border-radius:12px;background:color-mix(in srgb,var(--accent) 14%,var(--surface));color:var(--good);font-weight:700}
.addshot{min-height:56px;border:2px dashed var(--line);border-radius:12px;color:var(--muted);font-weight:700;width:100%}

/* bottom dock */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.dock-in{max-width:640px;margin:0 auto;padding-block:10px;display:flex;flex-direction:column;gap:10px}
.live{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;text-align:center}
.live div{display:flex;flex-direction:column}
.live b{font-family:var(--display);font-size:24px;line-height:1.05}
.live span{font-size:11px;letter-spacing:.6px;text-transform:uppercase;color:var(--muted);font-weight:700}
.actions{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.actions .btn{padding:0 8px;font-size:16px}

/* sheets */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:40}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--surface);border-radius:18px 18px 0 0;max-height:88%;overflow:auto;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 12px)}
.sheet-in{max-width:640px;margin:0 auto;padding-block:12px 4px;display:flex;flex-direction:column;gap:12px}
.sheet-h{display:flex;align-items:center;justify-content:space-between;gap:8px}
.sheet-h h2{font-size:22px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.pick{min-height:64px;border-radius:14px;border:2px solid var(--line);background:var(--surface);font-weight:700;font-size:19px}
.pick.big{min-height:76px;font-size:21px}
.pick.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 16%,var(--surface))}
.pick.sel{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.pick small{display:block;font-size:13px;font-weight:600;color:var(--muted)}
.lie-G{border-color:var(--accent)}
.lie-A{border-color:var(--flag)}
.display{font-family:var(--display);font-size:54px;font-weight:700;text-align:center;background:var(--sunk);border-radius:14px;padding:6px;line-height:1.1}
.display .u{font-size:22px;color:var(--muted);margin-left:6px}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.keys button{min-height:62px;border-radius:14px;background:var(--sunk);font-family:var(--display);font-size:30px;font-weight:700}
.dirgrid{display:grid;grid-template-columns:auto repeat(3,1fr);gap:6px;align-items:center}
.dirgrid .lab{font-size:13px;font-weight:700;color:var(--muted);text-align:center}
.dirgrid .pick{min-height:66px;font-size:15px}
.dirgrid .pick.center{border-color:var(--accent)}

/* scorecard + stats */
.sc-wrap{overflow-x:auto}
table.sc{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums;font-size:15px}
table.sc th,table.sc td{padding:8px 4px;text-align:center;border-bottom:1px solid var(--line)}
table.sc th{font-size:12px;letter-spacing:.6px;text-transform:uppercase;color:var(--muted)}
table.sc td.h{font-weight:700}
.s-u{color:var(--under);font-weight:700}
.s-o{color:var(--bad);font-weight:700}
.s-e{font-weight:700}
.tot td{font-weight:700;background:var(--sunk)}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.stat{background:var(--sunk);border-radius:12px;padding:12px}
.stat b{display:block;font-family:var(--display);font-size:30px;line-height:1.05}
.stat span{font-size:13px;color:var(--muted);font-weight:600}
.stat small{display:block;font-size:12px;color:var(--muted)}
.t5{display:flex;flex-direction:column}
.t5 div{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line);gap:8px}
.t5 b{font-family:var(--display);font-size:22px}
.t5 b.hit{color:var(--bad)}
.notice{background:color-mix(in srgb,var(--flag) 22%,var(--surface));border-radius:12px;padding:12px 14px;font-size:15px}
.warn{color:var(--warn);font-weight:700}
.pargrid{display:grid;grid-template-columns:repeat(9,1fr);gap:4px}
.pargrid input{padding:6px 2px;text-align:center;min-height:44px;font-size:16px}
.pargrid .hn{font-size:12px;text-align:center;color:var(--muted);font-weight:700}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 170px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;z-index:60;max-width:90%}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media (min-width:560px){.stats{grid-template-columns:repeat(3,1fr)}}
</style>

<div id="app"></div>
<div id="layer"></div>

<script>
/* ================= DATOS ================= */
const KEY='golfApp_v1';
const VERSION='0.3';
const IS_PWA=!!window.PWA_BUILD;
const LIES={T:{n:'Tee',u:'yd'},F:{n:'Fairway',u:'yd'},R:{n:'Rough',u:'yd'},A:{n:'Arena',u:'yd'},X:{n:'Recuperación',u:'yd'},C:{n:'Fringe',u:'ft'},G:{n:'Green',u:'ft'}};
const PENS={OB:{n:'Fuera de límites',d:'Golpe y distancia',card:1,stat:2},BP:{n:'Bola perdida',d:'Golpe y distancia',card:1,stat:2},AP:{n:'Área de penalidad',d:'1 golpe',card:1,stat:1},IN:{n:'Injugable',d:'1 golpe',card:1,stat:1},OT:{n:'Otra',d:'Eliges los golpes',card:null,stat:null}};
const DIRS={I:'Izq.',F:'Fairway',D:'Der.'};
const GRID_ROWS=[['L','Largo'],['A','A la altura'],['C','Corto']];
const GRID_COLS=[['I','Izq.'],['E','En línea'],['D','Der.']];

function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8)}
function now(){return new Date().toISOString()}
function today(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function esc(s){return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}

let DB=null;
function load(){
  try{const raw=localStorage.getItem(KEY);if(raw){DB=JSON.parse(raw);if((DB.format||1)<2){migrate(DB);save()}return}}catch(e){}
  DB=defaultDB();
}
/* formato 2: el castigo es su propia fila en la lista de golpes */
function migrate(db){
  (db.rounds||[]).forEach(r=>Object.values(r.holes||{}).forEach(h=>{
    if(!Array.isArray(h.shots))return;const out=[];
    h.shots.forEach(x=>{if(x.kind==='pen'){out.push(x);return}const pn=x.pen;delete x.pen;out.push(x);
      if(pn)out.push({id:uid(),kind:'pen',type:pn.type,strokes:pn.strokes})});
    h.shots=out}));
  db.format=2;
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(DB))}catch(e){}}

function defaultDB(){
  const codes=['Dr','2W','3W','4h','5i','6i','7i','8i','9i','PW','50°','56°','60°','62°','Pu'];
  const bag=codes.map(c=>({id:uid(),code:c,name:'',active:true,updatedAt:now()}));
  const pars=[4,4,3,5,4,4,3,4,5,4,3,4,5,4,4,3,4,5];
  const yards=[401,380,165,520,410,365,180,395,540,415,175,390,530,405,360,190,420,515];
  const course={id:uid(),name:'Cancha de ejemplo',city:'Santiago',type:'regular',example:true,
    holes:pars.map(p=>({par:p})),
    tees:[{id:uid(),name:'Azul',yards,ratingM:72.4,slopeM:131,ratingW:null,slopeW:null}],updatedAt:now()};
  const player={id:uid(),name:'Jugador',gender:'M',hcpOfficial:null};
  const db={format:1,players:[player],activePlayer:player.id,bag,retired:[],courses:[course],rounds:[],
    settings:{theme:'system',hideStats:false}};
  db.rounds.push(sampleRound(db,course,player));
  migrate(db);
  return db;
}
function sampleRound(db,course,player){
  const c=code=>db.bag.find(b=>b.code===code).id;
  const S=(lie,dist,club,pen)=>({id:uid(),lie,dist,club:club?c(club):null,dir:null,pen:pen||null,unc:false});
  const H={
    1:[S('T',401,'Dr'),S('F',136,'9i'),S('G',35,'Pu'),S('G',1,'Pu')],
    2:[S('T',380,'Dr'),S('R',150,'7i'),S('C',40,'56°'),S('G',4,'Pu')],
    3:[S('T',165,'7i'),S('A',20,'56°'),S('G',6,'Pu'),S('G',1,'Pu')],
    4:[S('T',520,'Dr',{type:'OB'}),S('T',520,'Dr'),S('F',250,'3W'),S('R',80,'56°'),S('G',18,'Pu'),S('G',2,'Pu')],
    5:[S('T',410,'Dr'),S('F',160,'7i'),S('G',22,'Pu'),S('G',3,'Pu'),S('G',1,'Pu')],
    6:[S('T',365,'Dr'),S('F',110,'PW'),S('G',12,'Pu')],
    7:[S('T',180,'6i'),S('R',30,'60°'),S('R',8,'60°'),S('G',5,'Pu')],
    8:[S('T',395,'Dr'),S('X',170,'9i'),S('F',120,'50°'),S('G',15,'Pu'),S('G',2,'Pu')],
    9:[S('T',540,'Dr'),S('F',260,'3W'),S('A',40,'56°'),S('G',3,'Pu')]
  };
  H[1][0].dir='F';H[2][0].dir='D';H[2][1].dir='CD';H[5][1].dir='AE';H[6][1].dir='LE';H[7][0].dir='CI';
  const holes={};Object.keys(H).forEach(n=>holes[n]={mode:'detail',shots:H[n],holed:true,yards:course.tees[0].yards[n-1]});
  return {id:uid(),playerId:player.id,courseId:course.id,teeId:course.tees[0].id,date:'2026-10-25',length:'front',startHole:1,
    tournament:false,mental:false,dayBag:db.bag.filter(b=>b.code!=='2W').map(b=>b.id),holes,status:'done',example:true,
    createdAt:now(),updatedAt:now()};
}

/* ================= CÁLCULOS ================= */
const course=id=>DB.courses.find(c=>c.id===id);
const tee=(c,id)=>c&&c.tees.find(t=>t.id===id);
const club=id=>DB.bag.find(b=>b.id===id)||(DB.retired||[]).find(b=>b.id===id);
function penCard(p){if(!p)return 0;return p.type==='OT'?(p.strokes||1):PENS[p.type].card}
function penStat(p){if(!p)return 0;return p.type==='OT'?(p.strokes||1):PENS[p.type].stat}
const isPen=e=>!!e&&e.kind==='pen';
function numbering(E){let k=0;return E.map(e=>{const start=k+1;k+=isPen(e)?penCard(e):1;return {start,end:k}})}
function toYd(s){if(s.dist==null||s.dist==='')return null;return (s.lie==='G'||s.lie==='C')?s.dist/3:s.dist}
const offGreen=s=>s.lie&&s.lie!=='G';

function holeOrder(r){
  const c=course(r.courseId);const N=c.holes.length;
  if(N<=9||r.length==='front'&&N===9)return [...Array(N)].map((_,i)=>i+1);
  if(r.length==='front')return [1,2,3,4,5,6,7,8,9];
  if(r.length==='back')return [10,11,12,13,14,15,16,17,18];
  const s=r.startHole||1;return [...Array(18)].map((_,i)=>((s-1+i)%18)+1);
}

function holeCalc(r,n){
  const c=course(r.courseId);const par=c.holes[n-1].par;
  const h=r.holes[n];
  const out={n,par,started:false,done:false};
  if(!h)return out;
  if(h.mode==='quick'){
    const q=h.quick||{};
    if(!q.strokes)return out;
    const strokes=q.strokes,putts=q.putts??null,gir=q.gir??null;
    return {...out,started:true,done:true,mode:'quick',strokes,putts,fir:par>=4?(q.fir??null):null,gir,
      threePutt:putts!=null?putts>=3:null,
      scrAtt:gir===false,scrMade:gir===false&&strokes<=par,
      udAtt:gir===false&&putts!=null,udMade:gir===false&&putts!=null&&putts<=1&&strokes<=par,udFar:null,
      bunkerAtt:0,bunkerMade:0,recov:null,twoChips:null,bogey150:null,penCard:null,penStat:null,unc:0,shotsN:0};
  }
  const E=h.shots||[];
  if(!E.length)return out;
  const nums=numbering(E);const done=!!h.holed;
  const strokes=nums[nums.length-1].end;
  let cardPen=0,statPen=0;E.forEach(e=>{if(isPen(e)){cardPen+=penCard(e);statPen+=penStat(e)}});
  const real=E.filter(e=>!isPen(e));
  const putts=real.filter(x=>x.lie==='G').length;
  const fromHere=i=>strokes-nums[i].start+1;
  let fir=null;
  if(par>=4){const fi=E.findIndex(e=>!isPen(e));const nx=E[fi+1];
    if(nx)fir=isPen(nx)?false:(nx.lie?['F','C','G'].includes(nx.lie):null);else if(done)fir=true}
  let gir=null;const gi=E.findIndex(e=>!isPen(e)&&e.lie==='G');
  if(gi>=0)gir=nums[gi].start-1<=par-2;else if(done)gir=strokes<=par-2;
  const R={...out,started:true,done,mode:'detail',strokes,putts,fir,gir,penCard:cardPen,penStat:statPen,
    recov:real.filter(x=>x.lie==='X').length,shotsN:real.length,unc:real.filter(x=>x.unc).length};
  R.threePutt=done?putts>=3:null;
  R.scrAtt=done&&gir===false;R.scrMade=R.scrAtt&&strokes<=par;
  R.udAtt=false;R.udMade=false;R.udFar=null;
  if(done&&gir===false){let j=-1;E.forEach((x,i)=>{if(!isPen(x)&&offGreen(x))j=i});
    if(j>=0){R.udAtt=true;R.udMade=fromHere(j)<=2&&strokes<=par;const y=toYd(E[j]);R.udFar=y==null?null:y>=50}}
  R.bunkerAtt=0;R.bunkerMade=0;
  E.forEach((x,i)=>{if(isPen(x))return;const y=toYd(x);if(x.lie==='A'&&y!=null&&y<=50){R.bunkerAtt++;if(done&&fromHere(i)<=2)R.bunkerMade++}});
  R.twoChips=false;
  for(let i=0;i+1<E.length;i++){const a=E[i],b=E[i+1];if(isPen(a)||isPen(b))continue;const ya=toYd(a),yb=toYd(b);
    if(offGreen(a)&&offGreen(b)&&ya!=null&&yb!=null&&ya<=50&&yb<=50){R.twoChips=true;break}}
  R.bogey150=false;
  if(done&&strokes>=par+1)E.forEach((x,i)=>{if(isPen(x))return;const y=toYd(x);if(['T','F','R','A'].includes(x.lie)&&y!=null&&y<=150&&nums[i].start<=par-2)R.bogey150=true});
  R.drives=[];
  if(par>=4)E.forEach((x,i)=>{const nx=E[i+1];if(isPen(x)||x.lie!=='T'||!nx||isPen(nx))return;const a=toYd(x),b=toYd(nx);if(a!=null&&b!=null&&a>b)R.drives.push(a-b)});
  return R;
}

function roundCalc(r){
  const order=holeOrder(r);const H=order.map(n=>holeCalc(r,n));const D=H.filter(h=>h.done);
  const sum=f=>D.reduce((a,h)=>a+(f(h)||0),0);
  const A={holes:H,done:D,thru:D.length,strokes:sum(h=>h.strokes),par:sum(h=>h.par)};
  A.toPar=A.strokes-A.par;
  const P=D.filter(h=>h.putts!=null);A.putts=P.reduce((a,h)=>a+h.putts,0);A.puttHoles=P.length;
  const F=D.filter(h=>h.fir!=null);A.firHit=F.filter(h=>h.fir).length;A.firN=F.length;
  const G=D.filter(h=>h.gir!=null);A.girHit=G.filter(h=>h.gir).length;A.girN=G.length;
  A.scrAtt=D.filter(h=>h.scrAtt).length;A.scrMade=D.filter(h=>h.scrMade).length;
  A.udAtt=D.filter(h=>h.udAtt).length;A.udMade=D.filter(h=>h.udMade).length;
  A.udNearAtt=D.filter(h=>h.udAtt&&h.udFar===false).length;A.udNearMade=D.filter(h=>h.udMade&&h.udFar===false).length;
  A.udFarAtt=D.filter(h=>h.udAtt&&h.udFar===true).length;A.udFarMade=D.filter(h=>h.udMade&&h.udFar===true).length;
  A.bunkerAtt=sum(h=>h.bunkerAtt);A.bunkerMade=sum(h=>h.bunkerMade);
  A.penCard=sum(h=>h.penCard);A.penStat=sum(h=>h.penStat);A.recov=sum(h=>h.recov);
  A.t5={par5:D.filter(h=>h.par===5&&h.strokes>=6).length,dbl:D.filter(h=>h.strokes>=h.par+2).length,
    three:D.filter(h=>h.threePutt).length,b150:D.filter(h=>h.bogey150).length,chips:D.filter(h=>h.twoChips).length};
  A.shotsN=sum(h=>h.shotsN);A.unc=sum(h=>h.unc);
  const dr=D.flatMap(h=>h.drives||[]);A.driveN=dr.length;A.driveAvg=dr.length?Math.round(dr.reduce((a,b)=>a+b,0)/dr.length):null;A.driveMax=dr.length?Math.round(Math.max(...dr)):null;
  return A;
}
const pct=(a,b)=>b?Math.round(a/b*100)+'%':'–';
const fmtPar=d=>d===0?'E':(d>0?'+'+d:String(d));

function lastDayBag(){const r=[...DB.rounds].sort((a,b)=>b.createdAt.localeCompare(a.createdAt))[0];

/* ---------- HOYO ---------- */
function vHole(){
  const r=curRound();if(!r){ui.view='home';return vHome()}
  const c=course(r.courseId),t=tee(c,r.teeId);const order=holeOrder(r);
  const n=ui.hole;const idx=order.indexOf(n);const par=c.holes[n-1].par;
  const h=r.holes[n]||(r.holes[n]={mode:'detail',shots:[],holed:false,yards:t?t.yards[n-1]:null});
  if(h.mode!=='quick'&&!h.shots.length&&!h.holed){h.shots.push({id:uid(),lie:'T',dist:h.yards!=null?+h.yards:null,club:null,dir:null,unc:false});touch(r)}
  const A=roundCalc(r);
  const yds=h.yards??(t?t.yards[n-1]:'');
  const head=`<header class="top wrap"><div class="top-in" style="flex-direction:column;align-items:stretch;gap:8px">
    <div class="row" style="justify-content:space-between">
      <button class="iconbtn txt" data-a="go" data-v="home">Salir</button>
      <div class="seg" style="width:190px"><button data-a="mode" data-v="detail" aria-pressed="${h.mode!=='quick'}">Detallado</button><button data-a="mode" data-v="quick" aria-pressed="${h.mode==='quick'}">Rápido</button></div>
      <button class="iconbtn txt" data-a="sheet" data-v="card">Tarjeta</button>
    </div>
    <div class="holehead">
      <button class="navbtn" data-a="hole" data-v="${order[idx-1]}" ${idx>0?'':'disabled'} aria-label="Hoyo anterior">‹</button>
      <div class="mid"><div class="holeno">Hoyo ${n}</div><div class="holemeta">Par <b>${par}</b> · <button data-a="sheet" data-v="yards" style="font-weight:700;color:var(--ink);text-decoration:underline;text-underline-offset:3px">${yds||'–'} yd</button></div></div>
      <button class="navbtn" data-a="hole" data-v="${order[idx+1]}" ${idx<order.length-1?'':'disabled'} aria-label="Hoyo siguiente">›</button>
    </div></div></header>`;
  let body='';
  if(h.mode==='quick')body=vQuick(h,par);
  else{
    const shots=h.shots;const nums=numbering(shots);
    const curI=h.holed?-1:shots.length-1;
    body=`<section class="shots">${shots.map((s,i)=>shotRow(s,i,i===curI,par,nums[i])).join('')}
      ${h.holed?`<div class="holed">✓ Hoyo terminado en ${holeCalc(r,n).strokes} golpes · toca un golpe para corregirlo</div>`:
        `<button class="addshot" data-a="addShot">+ Golpe ${(nums.length?nums[nums.length-1].end:0)+1}</button>`}
    </section>`;
  }
  const hide=DB.settings.hideStats;
  const live=hide?`<div class="row" style="justify-content:space-between"><span class="muted">Estadísticas ocultas</span><button class="btn sm ghost" data-a="hideStats">Mostrar</button></div>`:
    `<button class="live num" data-a="sheet" data-v="liveinfo" aria-label="Detalle de estadísticas">
      <div><b>${A.thru}</b><span>Hoyos</span></div>
      <div><b class="${A.toPar<0?'s-u':A.toPar>0?'s-o':''}">${A.thru?fmtPar(A.toPar):'–'}</b><span>Al par</span></div>
      <div><b>${A.puttHoles?A.putts:'–'}</b><span>Putts</span></div>
      <div><b>${A.firN?A.firHit+'/'+A.firN:'–'}</b><span>Fairways</span></div>
      <div><b>${A.girN?A.girHit+'/'+A.girN:'–'}</b><span>GIR</span></div></button>`;
  const last=h.shots[h.shots.length-1];
  const acts=h.mode==='quick'?`<button class="btn primary block" data-a="quickNext">${idx<order.length-1?'Siguiente hoyo':'Terminar ronda'}</button>`:
    h.holed?`<div class="actions" style="grid-template-columns:1fr 1fr"><button class="btn" data-a="sheet" data-v="card">Tarjeta</button><button class="btn primary" data-a="${idx<order.length-1?'nextHole':'finish'}">${idx<order.length-1?'Hoyo '+order[idx+1]+' ›':'Terminar ronda'}</button></div>`:
    `<div class="actions" style="grid-template-columns:1fr 2fr"><button class="btn" data-a="addShot">+ Golpe</button><button class="btn flag" data-a="holeOut" ${last?'':'disabled'}>Embocada</button></div>`;
  return head+`<main class="wrap" style="padding-bottom:200px">${body}</main>
  <div class="dock"><div class="dock-in wrap">${live}${acts}</div></div>`;
}
function shotRow(s,i,cur,par,nm){
  const numTxt=nm.end>nm.start?nm.start+'–'+nm.end:String(nm.start);

    <button class="cell ${cl?'':'blank'}" data-a="edit" data-f="club" data-i="${i}">${cl?esc(cl.code):'Palo'}</button>

    <button class="more" data-a="rowMenu" data-i="${i}" aria-label="Más opciones del golpe ${nm.start}">⋯</button>

function vQuick(h,par){
  const q=h.quick||(h.quick={strokes:null,putts:null,fir:null,gir:null});

  const st=(v,l,s)=>`<div class="stat"><b class="num">${v}</b><span>${l}</span>${s?`<small>${s}</small>`:''}</div>`;
  const t5=[['Bogey o peor en par 5',A.t5.par5],['Doble bogey o peor',A.t5.dbl],['Tres putts',A.t5.three],['Bogey desde 150 yd o menos',A.t5.b150],['Dos chips',A.t5.chips]];
  return topbar('Resumen',esc(c?c.name:''),back('home'),r.status==='open'?`<button class="iconbtn txt" data-a="resume" data-id="${r.id}">Seguir</button>`:'')+
  `<main class="wrap">
    <div class="card row" style="justify-content:space-between">
      <div><div style="font-weight:700;font-size:18px">${esc(r.date)} · ${t?esc(t.name):''}</div><div class="muted" style="font-size:14px">${A.thru} hoyos${r.tournament?' · Torneo':' · Práctica'}${r.example?' · Ronda de ejemplo':''}</div></div>

    <div class="stats">
      ${st(A.puttHoles?A.putts:'–','Putts',A.puttHoles?(A.putts/A.puttHoles).toFixed(2)+' por hoyo · solo desde el green':'')}
      ${st(A.driveAvg??'–','Drive promedio',A.driveN?'Máximo '+A.driveMax+' yd · '+A.driveN+' salidas':'')}
      ${st(pct(A.firHit,A.firN),'Fairways',A.firHit+' de '+A.firN)}
      ${st(pct(A.girHit,A.girN),'Greens en regulación',A.girHit+' de '+A.girN)}
      ${st(pct(A.udMade,A.udAtt),'Up & down',`${A.udMade} de ${A.udAtt} · <50 yd ${A.udNearMade}/${A.udNearAtt} · 50+ ${A.udFarMade}/${A.udFarAtt}`)}
      ${st(pct(A.scrMade,A.scrAtt),'Scrambling',A.scrMade+' de '+A.scrAtt)}
      ${st(pct(A.bunkerMade,A.bunkerAtt),'Bunker save',A.bunkerMade+' de '+A.bunkerAtt)}
      ${st(A.penStat,'Golpes de castigo',A.penCard+' en la tarjeta (golpe y distancia cuenta 2)')}
      ${st(A.recov,'Recuperaciones','')}
      ${r.mental?st(A.shotsN?pct(A.shotsN-A.unc,A.shotsN):'–','Compromiso','Meta 95%'):''}
    </div>
    <div class="card"><h3>Tiger 5</h3><div class="t5">${t5.map(([l,v])=>`<div><span>${l}</span><b class="num ${v?'hit':''}">${v}</b></div>`).join('')}</div></div>
    <div class="card"><h3>Tarjeta</h3>${scorecard(r)}</div>
    <p class="muted" style="font-size:13px">Strokes gained aparece cuando carguemos la tabla de Broadie.</p>
    ${r.status==='open'?`<button class="btn primary block" data-a="closeRound">Guardar y cerrar la ronda</button>`:''}
    <button class="btn danger block" data-a="askDelRound">Borrar ronda</button>
  </main>`;
}
function scorecard(r){
  const A=roundCalc(r);const H=A.holes;
  const cls=h=>!h.done?'':h.strokes<h.par?'s-u':h.strokes>h.par?'s-o':'s-e';
  const block=(list,lab)=>{if(!list.length)return '';const d=list.filter(h=>h.done);
    return list.map(h=>`<tr><td class="h">${h.n}</td><td>${h.par}</td><td class="${cls(h)}">${h.done?h.strokes:'·'}</td><td>${h.done&&h.putts!=null?h.putts:'·'}</td><td>${h.done&&h.fir!=null?(h.fir?'✓':'✗'):''}</td><td>${h.done&&h.gir!=null?(h.gir?'✓':'✗'):''}</td></tr>`).join('')+
    `<tr class="tot"><td>${lab}</td><td>${list.reduce((a,h)=>a+h.par,0)}</td><td>${d.reduce((a,h)=>a+h.strokes,0)||'·'}</td><td>${d.reduce((a,h)=>a+(h.putts||0),0)||'·'}</td><td></td><td></td></tr>`};
  const f=H.filter(h=>h.n<=9),b=H.filter(h=>h.n>9);
  return `<div class="sc-wrap"><table class="sc"><thead><tr><th>Hoyo</th><th>Par</th><th>Score</th><th>Putts</th><th>FW</th><th>GIR</th></tr></thead><tbody>${block(f,'Ida')}${block(b,'Vuelta')}</tbody></table></div>`;
}

    if(s.fresh&&!s.lie&&s.dist==null&&!s.club){h.shots.pop();touch(r)} else if(s)delete s.fresh}}
  ui.sheet=null;ui.chain=null;render();
}

/* ================= ACCIONES DE ANOTACIÓN ================= */
function H(){const r=curRound();return r.holes[ui.hole]}
function newShot(defaults){return {id:uid(),lie:null,dist:null,club:null,dir:null,pen:null,unc:false,fresh:true,...(defaults||{})}}
function startChainFor(i){const h=H();const s=h.shots[i];
  if(!s.lie){openSheet({type:'lie',i,chain:true});return}
  if(s.dist==null){openSheet({type:'dist',i,chain:true,buf:''});return}
  if(!s.club){if(s.lie==='G'){s.club=putterId();return advanceAfterClub(i)}openSheet({type:'club',i,chain:true});return}
  advanceAfterClub(i);
}
function putterId(){const r=curRound();const p=(r.dayBag||[]).map(club).find(b=>b&&/^pu/i.test(b.code));return p?p.id:null}
function addShot(){
  const r=curRound(),h=H();if(h.holed)return;
  const i=h.shots.length;
  if(i===0){h.shots.push(newShot({lie:'T',dist:+(h.yards)||null}));delete h.shots[0].fresh}
  else h.shots.push(newShot());
  touch(r);render();startChainFor(i);
}
function advanceAfterClub(i){
  const r=curRound(),h=H();touch(r);
  // chain continues: create next shot and ask its lie
  ui.sheet=null;
  if(h.holed){render();return}
  const nxt=newShot();h.shots.push(nxt);touch(r);render();openSheet({type:'lie',i:h.shots.length-1,chain:true});
}
function afterField(s,field){
  // called after a field is set; continue chain or close
  const sh=ui.sheet;const i=sh.i;const h=H();const shot=h.shots[i];delete shot.fresh;
  if(!sh.chain){ui.sheet=null;touch(curRound());render();return}
  if(field==='lie'){
    if(shot.dist==null){openSheet({type:'dist',i,chain:true,buf:''});render();return}
    field='dist';
  }
  if(field==='dist'){
    if(shot.lie==='G'){if(!shot.club)shot.club=putterId();ui.sheet=null;touch(curRound());render();return}
    if(!shot.club){openSheet({type:'club',i,chain:true});render();return}
  }
  advanceAfterClub(i);
}
function openTeeChain(){const h=H();if(h&&h.mode!=='quick'&&h.shots.length===1&&!h.holed&&!h.shots[0].club)openSheet({type:'club',i:0,chain:true})}
function afterPen(sh){
  const r=curRound(),h=H();const i=sh.i;ui.sheet=null;touch(r);
  if(sh.edit||h.holed||i!==h.shots.length-1){render();return}
  const e=h.shots[i];
  if(e.type==='OB'||e.type==='BP'){let p=i-1;while(p>=0&&isPen(h.shots[p]))p--;const prev=h.shots[p];
    if(prev)h.shots.push({id:uid(),lie:prev.lie,dist:prev.dist,club:prev.club,dir:null,unc:false})}
  h.shots.push(newShot());touch(r);render();openSheet({type:'lie',i:h.shots.length-1,chain:true});
}
function holeDone(){
  const r=curRound(),h=H();h.holed=true;touch(r);
  if(r.mental){ui.sheet={type:'mental'};render();return}
  ui.sheet=null;render();toast('Hoyo '+ui.hole+' terminado');
}
function nextHole(){const r=curRound();const o=holeOrder(r);const i=o.indexOf(ui.hole);if(i<o.length-1){ui.hole=o[i+1];r.currentHole=ui.hole;touch(r)}ui.sheet=null;render();window.scrollTo(0,0);openTeeChain()}

/* ================= EVENTOS ================= */
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-a]');if(!el||el.disabled)return;
  if(el.tagName==='SELECT'||el.tagName==='INPUT'&&el.type!=='button'||el.tagName==='TEXTAREA')return;
  const a=el.dataset.a,v=el.dataset.v;
  const r=curRound();
  const sh=ui.sheet;
  switch(a){
    case 'go':ui.edit=null;ui.exportText=null;go(v);break;
    case 'close':closeSheet();break;
    case 'resume':ui.roundId=el.dataset.id;{const rr=curRound();ui.hole=rr.currentHole||holeOrder(rr)[0]}go('hole');break;
    case 'openSummary':ui.roundId=el.dataset.id;go('summary');break;
    case 'openSummaryCur':go('summary');break;
    /* nueva ronda */
    case 'nrLen':ui.edit.length=v;render();break;
    case 'nrTog':ui.edit[el.dataset.k]=!ui.edit[el.dataset.k];render();break;
    case 'nrBag':{const b=ui.edit.dayBag;const id=el.dataset.id;const k=b.indexOf(id);if(k>=0)b.splice(k,1);else b.push(id);
      ui.edit.dayBag=DB.bag.filter(x=>b.includes(x.id)).map(x=>x.id);render();break}
    case 'startRound':{const e2=ui.edit;const c=course(e2.courseId);if(!c)return;
      const rr={id:uid(),playerId:DB.activePlayer,courseId:c.id,teeId:e2.teeId,date:e2.date||today(),length:c.holes.length===9?'front':e2.length,startHole:+e2.startHole||1,
        tournament:e2.tournament,mental:e2.mental,dayBag:e2.dayBag,holes:{},status:'open',createdAt:now(),updatedAt:now()};
      DB.rounds.push(rr);save();ui.edit=null;ui.roundId=rr.id;ui.hole=holeOrder(rr)[0];rr.currentHole=ui.hole;go('hole');openTeeChain();break}
    /* hoyo */
    case 'hole':if(v&&v!=='undefined'){ui.hole=+v;r.currentHole=ui.hole;touch(r);render();window.scrollTo(0,0)}break;
    case 'mode':{const h=H();if(v==='quick'&&h.shots.length&&!h.quick){h.quick={strokes:null,putts:null,fir:null,gir:null}}h.mode=v;touch(r);render();break}
    case 'addShot':addShot();break;
    case 'edit':{const i=+el.dataset.i,f=el.dataset.f;const shot=H().shots[i];
      if(f==='dist')openSheet({type:'dist',i,buf:shot.dist!=null?String(shot.dist):''});else openSheet({type:f,i});break}
    case 'setLie':{const shot=H().shots[sh.i];shot.lie=v;if(v==='G'&&!shot.club)shot.club=putterId();if(v!=='G'&&shot.club===putterId()&&!sh.chain){}afterField(shot,'lie');break}
    case 'key':{let b=sh.buf||'';if(v==='C')b='';else if(v==='B')b=b.slice(0,-1);else if(b.length<3)b=(b+v).replace(/^0+(?=\d)/,'');sh.buf=b;renderSheet();break}
    case 'saveDist':{const shot=H().shots[sh.i];shot.dist=sh.buf===''?null:+sh.buf;afterField(shot,'dist');break}
    case 'setClub':{const shot=H().shots[sh.i];shot.club=el.dataset.id;afterField(shot,'club');break}
    case 'skip':{const shot=H().shots[sh.i];const f=sh.type;afterField(shot,f==='lie'?'lie':f==='dist'?'dist':'club');break}
    case 'prevHoled':{const h=H();h.shots.splice(sh.i,1);ui.sheet=null;holeDone();break}
    case 'setDir':{const shot=H().shots[sh.i];shot.dir=v||null;ui.sheet=null;touch(r);render();break}
    case 'lieIsPen':openSheet({type:'pen',i:sh.i,chain:sh.chain});break;
    case 'editPen':openSheet({type:'pen',i:+el.dataset.i,edit:true});break;
    case 'setPen':{if(v==='OT'){sh.ot=true;renderSheet();break}
      const h=H();h.shots[sh.i]={id:h.shots[sh.i].id,kind:'pen',type:v};afterPen(sh);break}
    case 'setOt':{const h=H();h.shots[sh.i]={id:h.shots[sh.i].id,kind:'pen',type:'OT',strokes:+v};afterPen(sh);break}
    case 'rowMenu':openSheet({type:'rowMenu',i:+el.dataset.i});break;
    case 'insertBefore':{const h=H();const i=sh.i;const ns=newShot();delete ns.fresh;h.shots.splice(i,0,ns);touch(r);ui.sheet=null;render();openSheet({type:'lie',i});break}
    case 'delShot':{const h=H();const wasLast=sh.i===h.shots.length-1;h.shots.splice(sh.i,1);if(!h.shots.length||wasLast)h.holed=false;touch(r);ui.sheet=null;render();break}
    case 'toggleUnc':{const shot=H().shots[sh.i];shot.unc=!shot.unc;touch(r);ui.sheet=null;render();break}
    case 'holeOut':{const h=H();const last=h.shots[h.shots.length-1];if(!last)break;
      if(last.fresh&&!last.lie&&last.dist==null){h.shots.pop()}
      const L=h.shots[h.shots.length-1];if(!L){render();break}delete L.fresh;
      if(!isPen(L)&&L.lie==='G'){openSheet({type:'holeOut'});break}
      holeDone();break}
    case 'holedThis':holeDone();break;
    case 'holedNext':{const h=H();h.shots.push({id:uid(),lie:'G',dist:null,club:putterId(),dir:null,pen:null,unc:false});holeDone();break}
    case 'mentalTog':{const s=H().shots[+el.dataset.i];s.unc=!s.unc;touch(r);renderSheet();break}
    case 'mentalDone':ui.sheet=null;render();toast('Hoyo '+ui.hole+' terminado');break;
    case 'nextHole':nextHole();break;
    case 'quickNext':{const o=holeOrder(r);if(o.indexOf(ui.hole)<o.length-1)nextHole();else go('summary');break}
    case 'qStep':{const q=H().quick;const k=el.dataset.k;const par=course(r.courseId).holes[ui.hole-1].par;
      let val=q[k]??(k==='strokes'?par-1:(k==='putts'?1:0));val=Math.max(k==='strokes'?1:0,val+(+v));q[k]=val;touch(r);render();break}
    case 'qSet':{H().quick[el.dataset.k]=v==='null'?null:v==='true';touch(r);render();break}
    case 'sheet':openSheet({type:v});break;
    case 'ykey':{let b=sh.buf??String(H().yards??'');if(v==='C')b='';else if(v==='B')b=b.slice(0,-1);else if(b.length<3)b=(b+v).replace(/^0+(?=\d)/,'');sh.buf=b;renderSheet();break}
    case 'saveYards':{const h=H();h.yards=sh.buf===''?null:+sh.buf;if(h.shots[0]&&h.shots[0].lie==='T')h.shots[0].dist=h.yards;touch(r);ui.sheet=null;render();break}
    case 'hideStats':DB.settings.hideStats=!DB.settings.hideStats;save();ui.sheet=null;render();break;
    case 'finish':go('summary');break;
    case 'closeRound':r.status='done';touch(r);go('home');toast('Ronda guardada');break;
    case 'askDelRound':openSheet({type:'confirm',title:'Borrar ronda',text:'Se borra esta ronda y todos sus golpes. No se puede deshacer.',yes:'delRound',yesLabel:'Borrar'});break;
    case 'delRound':DB.rounds=DB.rounds.filter(x=>x.id!==ui.roundId);save();ui.sheet=null;go('home');toast('Ronda borrada');break;
    /* canchas */
    case 'newCourse':ui.edit={id:null,name:'',city:'',type:'regular',holes:[...Array(18)].map(()=>({par:4})),tees:[{id:uid(),name:'',yards:Array(18).fill(''),ratingM:null,slopeM:null,ratingW:null,slopeW:null}],teeIdx:0};go('courseEdit',{edit:ui.edit});break;
    case 'editCourse':{const c=course(el.dataset.id);ui.edit=JSON.parse(JSON.stringify(c));ui.edit.teeIdx=0;go('courseEdit',{edit:ui.edit});break}
    case 'ceHoles':{const n=+v;const e2=ui.edit;while(e2.holes.length<n)e2.holes.push({par:4});e2.holes.length=n;e2.tees.forEach(t=>{while(t.yards.length<18)t.yards.push('')});render();break}
    case 'ceType':ui.edit.type=v;render();break;
    case 'ceTee':ui.edit.teeIdx=+v;render();break;
    case 'ceAddTee':ui.edit.tees.push({id:uid(),name:'',yards:Array(18).fill(''),ratingM:null,slopeM:null,ratingW:null,slopeW:null});ui.edit.teeIdx=ui.edit.tees.length-1;render();break;
    case 'ceSave':{const e2=ui.edit;if(!e2.name.trim()){toast('Ponle nombre a la cancha');break}
      const c={id:e2.id||uid(),name:e2.name.trim(),city:e2.city,type:e2.type,example:e2.example,holes:e2.holes.map(h=>({par:+h.par||4})),
        tees:e2.tees.map((t,i)=>({...t,name:t.name||('Salida '+(i+1)),yards:t.yards.map(y=>y===''?null:+y)})),updatedAt:now()};
      const k=DB.courses.findIndex(x=>x.id===c.id);if(k>=0)DB.courses[k]=c;else DB.courses.push(c);save();ui.edit=null;go('courses');toast('Cancha guardada');break}
    case 'askDelCourse':openSheet({type:'confirm',title:'Borrar cancha',text:'Las rondas jugadas en esta cancha también se borran.',yes:'delCourse',yesLabel:'Borrar'});break;
    case 'delCourse':{const id=ui.edit.id;DB.courses=DB.courses.filter(c=>c.id!==id);DB.rounds=DB.rounds.filter(x=>x.courseId!==id);save();ui.sheet=null;ui.edit=null;go('courses');break}
    /* bolsa */
    case 'bagAdd':{const code=document.getElementById('bag-new-code').value.trim();if(!code){toast('Escribe el palo, por ejemplo 54°');break}
      DB.bag.push({id:uid(),code,name:document.getElementById('bag-new-name').value.trim(),active:true,updatedAt:now()});save();render();break}
    case 'bagReplace':{const k=DB.bag.findIndex(b=>b.id===el.dataset.id);const old=DB.bag[k];DB.retired=DB.retired||[];DB.retired.push({...old,active:false,retiredAt:now()});
      DB.bag[k]={id:uid(),code:old.code,name:'',active:true,updatedAt:now()};save();render();toast(old.code+' reemplazado; el anterior queda en el historial');break}
    /* ajustes */
    case 'plGender':DB.players.find(p=>p.id===DB.activePlayer).gender=v;save();render();break;
    case 'theme':DB.settings.theme=v;save();render();break;
    case 'exportFile':exportFile();break;
    case 'exportShow':ui.exportText=JSON.stringify(DB,null,1);render();break;
    case 'copyExport':{const ta=document.getElementById('exp-text');const txt=ui.exportText;
      navigator.clipboard&&navigator.clipboard.writeText?navigator.clipboard.writeText(txt).then(()=>toast('Respaldo copiado'),()=>{ta.select();toast('Selecciona y copia el texto')}):(ta.select(),toast('Selecciona y copia el texto'));break}
    case 'importPaste':importText(document.getElementById('imp-text').value);break;
    case 'delExamples':DB.rounds=DB.rounds.filter(x=>!x.example);DB.courses=DB.courses.filter(c=>!c.example||DB.rounds.some(x=>x.courseId===c.id));save();render();toast('Ejemplos quitados');break;
    case 'askReset':openSheet({type:'confirm',title:'Borrar todo',text:'Se borran todas las rondas, canchas y la bolsa de este navegador. Exporta un respaldo antes si lo necesitas.',yes:'reset',yesLabel:'Borrar todo'});break;
    case 'reset':DB=defaultDB();DB.rounds=[];save();ui.sheet=null;go('home');break;
  }
});
document.addEventListener('change',e=>{
  const el=e.target;const a=el.dataset.a;if(!a)return;
  if(a==='nrSet'){ui.edit[el.dataset.k]=el.value;if(el.dataset.k==='courseId')ui.edit.teeId=null;render()}
  if(a==='impFile'&&el.files[0]){const fr=new FileReader();fr.onload=()=>importText(fr.result);fr.readAsText(el.files[0])}
});
document.addEventListener('input',e=>{
  const el=e.target;const a=el.dataset.a;if(!a)return;
  if(a==='ceSet')ui.edit[el.dataset.k]=el.value;
  if(a==='ceTeeSet'){const t=ui.edit.tees[ui.edit.teeIdx||0];const k=el.dataset.k;t[k]=k==='name'?el.value:(el.value===''?null:+el.value.replace(',','.'))}
  if(a==='ceArr'){const i=+el.dataset.i;const val=el.value.replace(/\D/g,'');if(el.dataset.kind==='par')ui.edit.holes[i].par=val===''?'':+val;else ui.edit.tees[ui.edit.teeIdx||0].yards[i]=val===''?'':+val}
  if(a==='bagName'){const b=DB.bag.find(x=>x.id===el.dataset.id);b.name=el.value;b.updatedAt=now();save()}
  if(a==='plSet'){const p=DB.players.find(x=>x.id===DB.activePlayer);const k=el.dataset.k;p[k]=k==='hcpOfficial'?(el.value===''?null:+el.value.replace(',','.')):el.value;save()}
});
async function exportFile(){
  const name='golf-respaldo-'+today()+'.json';
  const blob=new Blob([JSON.stringify(DB)],{type:'application/json'});
  try{const file=new File([blob],name,{type:'application/json'});
    if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:'Respaldo de golf'});toast('Respaldo listo');return}}catch(e){if(e&&e.name==='AbortError')return}
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000);toast('Respaldo descargado');
}
function importText(txt){
  try{const inc=JSON.parse(txt);if(!inc||!Array.isArray(inc.rounds))throw 0;
    let added=0;const merge=(key)=>{(inc[key]||[]).forEach(x=>{const k=DB[key].findIndex(y=>y.id===x.id);
      if(k<0){DB[key].push(x);if(key==='rounds')added++}else if((x.updatedAt||'')>(DB[key][k].updatedAt||''))DB[key][k]=x})};
    ['courses','rounds','bag','players'].forEach(k=>{DB[k]=DB[k]||[];merge(k)});save();render();toast(added+' rondas nuevas importadas')}
  catch(err){toast('El texto no es un respaldo válido')}
}

load();render();
if(IS_PWA&&navigator.storage&&navigator.storage.persist){navigator.storage.persist().catch(()=>{})}
</script>

if('serviceWorker' in navigator){window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{})})}
</script>
